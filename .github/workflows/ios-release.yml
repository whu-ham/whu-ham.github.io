name: iOS Release Build

on:
  repository_dispatch:
    types: [ios-release-requested]

concurrency:
  group: ios-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    permissions:
      # Write is required to push the version bump and the beta metadata back
      # to this repository, to open the beta metadata pull request, and to
      # apply its label.
      contents: write
      pull-requests: write
      issues: write
    outputs:
      version_name: ${{ steps.build.outputs.version_name }}
      version_code: ${{ steps.build.outputs.version_code }}
      tag: ${{ steps.build.outputs.tag }}
      commit_sha: ${{ steps.bump.outputs.commit_sha }}

    steps:
      - name: Checkout iOS repository
        uses: actions/checkout@v5
        with:
          repository: whu-ham/ham-ios
          ref: ${{ github.event.client_payload.source_ref }}
          token: ${{ secrets.HAM_IOS_REPO_TOKEN }}
          fetch-depth: 0

      - name: Configure private proto repository access
        env:
          PROTO_REPO_TOKEN: ${{ secrets.PROTO_REPO_TOKEN }}
        run: |
          if [ -z "$PROTO_REPO_TOKEN" ]; then
            echo "::error::PROTO_REPO_TOKEN is required to clone whu-ham/ham-proto"
            exit 1
          fi
          PROTO_GIT_CONFIG="$RUNNER_TEMP/ham-proto-gitconfig"
          git config --file "$PROTO_GIT_CONFIG" url."https://x-access-token:${PROTO_REPO_TOKEN}@github.com/whu-ham/ham-proto.git".insteadOf "https://github.com/whu-ham/ham-proto.git"
          echo "GIT_CONFIG_GLOBAL=$PROTO_GIT_CONFIG" >> "$GITHUB_ENV"

      - name: Install fastlane
        run: |
          # fastlane is the only thing the Ruby toolchain was installed for:
          # the Gemfile lists just `gem "fastlane"`, there is no
          # fastlane/Pluginfile, and the lane uses only built-in actions.
          # Installing it with brew instead of Bundler also avoids a PATH
          # conflict: `brew install ruby` upgrades the runner's Ruby 3.4 to
          # 4.0, but /opt/homebrew/lib/ruby/gems/3.4.0/bin/bundle shadows the
          # new one, so `bundle install` and `bundle exec fastlane` end up
          # looking in different gem directories and the latter fails with
          # "Could not find fastlane-... in locally installed gems".
          brew install fastlane
          fastlane --version

      - name: Install protobuf
        run: |
          # The Podfile's post_install hook shells out to `protoc` to generate
          # the HamProtobuf Swift sources. That binary is not preinstalled on
          # GitHub-hosted macOS runners, so the step fails with
          # "Failed to generate HamProtobuf Swift sources".
          brew install protobuf
          protoc --version

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.2.0
        with:
          version: 10.6.4
          # pod_install.sh runs `pnpm install` before applying the glog patch.
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup App Store Connect API Key
        env:
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          echo "$ASC_KEY_CONTENT" > "$RUNNER_TEMP/private_keys/AuthKey.p8"

      - name: Create Keychain
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # Save original default keychain for later restoration
          ORIGINAL_DEFAULT=$(security default-keychain -d user | xargs)
          echo "ORIGINAL_DEFAULT_KEYCHAIN=$ORIGINAL_DEFAULT" >> $GITHUB_ENV
          security delete-keychain build.keychain 2>/dev/null || true
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | sed s/\"//g)

      - name: Cache CocoaPods downloads
        uses: actions/cache@v4
        with:
          # Only the download cache. ~/.cocoapods/repos is intentionally
          # excluded: it held the multi-gigabyte git spec repo this workflow
          # used before switching to CDN, and restoring it would cost more
          # than it saves.
          path: ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-cocoapods-${{ hashFiles('Ham/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-cocoapods-

      - name: Cache SwiftPM artifacts
        uses: actions/cache@v4
        with:
          # Binary artifacts (the protoc bundle, OpenSSL.xcframework) and the
          # cloned package repositories. Both the SwiftPM CLI and xcodebuild
          # read them from here, so a hit means neither has to download.
          path: |
            ~/Library/Caches/org.swift.swiftpm/artifacts
            ~/Library/Caches/org.swift.swiftpm/repositories
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('Ham/Ham.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'Component/HamProtobuf/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-

      - name: Install CocoaPods
        run: |
          # Pin the version recorded in Ham/Podfile.lock, which must stay at
          # 1.17.0. A newer CocoaPods rewrites every checksum in that file.
          COCOAPODS_VERSION=$(awk -F': *' '/^COCOAPODS:/{print $2; exit}' Ham/Podfile.lock)
          if [ -z "$COCOAPODS_VERSION" ]; then
            echo "::error::Could not read the COCOAPODS version from Ham/Podfile.lock"
            exit 1
          fi
          if gem list -i cocoapods --version "$COCOAPODS_VERSION" >/dev/null; then
            echo "CocoaPods $COCOAPODS_VERSION already installed"
          else
            echo "Installing CocoaPods $COCOAPODS_VERSION"
            gem install cocoapods --version "$COCOAPODS_VERSION" --no-document
          fi

      - name: Pre-resolve Xcode workspace Swift packages
        run: |
          # xcodebuild resolves the workspace's 27 Swift packages itself, and
          # on macOS runners that hangs indefinitely:
          #
          #   https://github.com/actions/runner-images/issues/13175 (still open)
          #
          # The SwiftPM CLI resolves the same graph reliably and writes to the
          # same shared cache (~/Library/Caches/org.swift.swiftpm) that
          # xcodebuild reads, so warming it here lets xcodebuild work from the
          # cache instead of resolving over the network.
          #
          # The Xcode project has no Package.swift of its own -- its packages
          # live in project.pbxproj -- so build a throwaway one from the
          # workspace's Package.resolved, pinning every version exactly.
          RESOLVED="Ham/Ham.xcworkspace/xcshareddata/swiftpm/Package.resolved"
          WARM_DIR="$RUNNER_TEMP/swiftpm-warm"
          mkdir -p "$WARM_DIR"
          python3 - "$RESOLVED" "$WARM_DIR/Package.swift" <<'PY'
          import json, sys
          resolved_path, out_path = sys.argv[1], sys.argv[2]
          with open(resolved_path) as handle:
              pins = json.load(handle).get("pins", [])
          if not pins:
              sys.exit("No pins found in %s" % resolved_path)
          lines = [
              "// swift-tools-version: 5.9",
              "import PackageDescription",
              "",
              "let package = Package(",
              '    name: "SwiftPMWarmCache",',
              "    products: [],",
              "    dependencies: [",
          ]
          for index, pin in enumerate(sorted(pins, key=lambda p: p["identity"])):
              version = pin.get("state", {}).get("version")
              if not version:
                  continue
              comma = "," if index < len(pins) - 1 else ""
              lines.append('        .package(url: "%s", exact: "%s")%s'
                           % (pin["location"], version, comma))
          lines += ["    ],", "    targets: []", ")"]
          with open(out_path, "w") as handle:
              handle.write("\n".join(lines) + "\n")
          print("Wrote %s with %d dependencies" % (out_path, len(pins)))
          PY
          cd "$WARM_DIR"
          # One operation at a time: concurrent fetches are what make the
          # xcodebuild path hang, and serialising them was reported to fix it.
          env SWIFTPM_MAX_CONCURRENT_OPERATIONS=1 swift package resolve

      - name: CocoaPods Install
        run: |
          # Use the project's own script rather than calling `pod install`
          # directly. It also applies the glog configure patch that
          # `pnpm install` alone does not, and it runs without `--repo-update`
          # because Podfile.lock pins every version.
          ./pod_install.sh

      - name: Build & Upload to TestFlight
        id: build
        # The default job timeout is 6 hours, and the SwiftPM hang shows up as
        # silence rather than an error, so cap this step explicitly. The bound
        # is generous because a cold archive of this workspace takes a while.
        timeout-minutes: 120
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PATH: ${{ runner.temp }}/private_keys/AuthKey.p8
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          RELEASE_NOTES: ${{ github.event.client_payload.release_notes }}
          VERSION_NUMBER: ${{ github.event.client_payload.version_number }}
          BUILD_NUMBER: ${{ github.event.client_payload.build_number }}
          PUBLIC_TESTING: ${{ github.event.client_payload.distribution == 'public' }}
          EXTERNAL_TESTING_GROUP: ${{ github.event.client_payload.external_testing_group }}
          CHANGELOG: ${{ github.event.client_payload.changelog }}
        run: fastlane ios beta

      - name: Validate build outputs
        env:
          VERSION_NAME: ${{ steps.build.outputs.version_name }}
          VERSION_CODE: ${{ steps.build.outputs.version_code }}
          TAG: ${{ steps.build.outputs.tag }}
        run: |
          set -euo pipefail
          # `set -e` does not abort on a failing `[[ ]]`, so check each value explicitly.
          [[ "$VERSION_NAME" =~ ^[0-9]+([.][0-9]+)*$ ]] || { echo "::error::Invalid version_name: $VERSION_NAME"; exit 1; }
          [[ "$VERSION_CODE" =~ ^[0-9]+$ ]] || { echo "::error::Invalid version_code: $VERSION_CODE"; exit 1; }
          [[ "$TAG" =~ ^v[0-9A-Za-z.+-]+$ ]] || { echo "::error::Invalid tag: $TAG"; exit 1; }

      - name: Commit version bump
        id: bump
        env:
          VERSION_NAME: ${{ steps.build.outputs.version_name }}
          VERSION_CODE: ${{ steps.build.outputs.version_code }}
          SOURCE_REF: ${{ github.event.client_payload.source_ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: bump version to ${VERSION_NAME} (${VERSION_CODE})"
          fi

          if ! git pull --rebase origin "$SOURCE_REF"; then
            git rebase --abort
            echo "::error::Rebase onto ${SOURCE_REF} failed. TestFlight already received ${VERSION_NAME} (${VERSION_CODE})."
            exit 1
          fi

          git push origin "HEAD:${SOURCE_REF}"
          COMMIT_SHA=$(git rev-parse HEAD)
          [[ "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Invalid commit sha: $COMMIT_SHA"; exit 1; }
          echo "commit_sha=$COMMIT_SHA" >> $GITHUB_OUTPUT

      - name: Notify iOS repository
        env:
          HAM_IOS_DISPATCH_TOKEN: ${{ secrets.HAM_IOS_DISPATCH_TOKEN }}
          REQUEST_ID: ${{ github.event.client_payload.request_id }}
          SOURCE_REF: ${{ github.event.client_payload.source_ref }}
          VERSION_NAME: ${{ steps.build.outputs.version_name }}
          VERSION_CODE: ${{ steps.build.outputs.version_code }}
          TAG: ${{ steps.build.outputs.tag }}
          COMMIT_SHA: ${{ steps.bump.outputs.commit_sha }}
        run: |
          # Use curl because the gh CLI is not guaranteed to exist on self-hosted macOS runners.
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${HAM_IOS_DISPATCH_TOKEN}" \
            "https://api.github.com/repos/whu-ham/ham-ios/dispatches" \
            --data-binary @- <<JSON
          {"event_type":"ios-release-completed","client_payload":{"request_id":"${REQUEST_ID}","source_ref":"${SOURCE_REF}","version_name":"${VERSION_NAME}","version_code":"${VERSION_CODE}","tag":"${TAG}","commit_sha":"${COMMIT_SHA}"}}
          JSON

      - name: Publish beta info to the docs site
        # Internal builds go to the internal TestFlight group only. The docs
        # site is public and links to a public TestFlight invite, so an
        # internal build must not appear there.
        if: ${{ github.event.client_payload.distribution == 'public' }}
        env:
          RELEASE_NOTES: ${{ github.event.client_payload.release_notes }}
          VERSION_NAME: ${{ steps.build.outputs.version_name }}
          VERSION_CODE: ${{ steps.build.outputs.version_code }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Keep in sync with the fallback invite in
          # docs/page/download/component/IOSDownloadPanel.vue.
          TESTFLIGHT_URL="itms-beta://testflight.apple.com/join/waKNnCG3"

          # Checkout the docs site on a scratch path so the build workspace stays clean.
          DOCS_DIR="$RUNNER_TEMP/ham-docs"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$DOCS_DIR"

          mkdir -p "$DOCS_DIR/docs/src/public"

          # Build the JSON with jq so notes containing quotes or newlines stay valid.
          PUBLISHED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq -n \
            --arg version_name "$VERSION_NAME" \
            --arg version_code "$VERSION_CODE" \
            --arg release_notes "$RELEASE_NOTES" \
            --arg testflight_url "$TESTFLIGHT_URL" \
            --arg published_at "$PUBLISHED_AT" \
            '{version_name:$version_name,version_code:$version_code,release_notes:$release_notes,testflight_url:$testflight_url,published_at:$published_at}' \
            > "$DOCS_DIR/docs/src/public/ios-beta.json"

          cd "$DOCS_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/src/public/ios-beta.json
          if git diff --cached --quiet; then
            echo "Beta info unchanged, nothing to publish."
            exit 0
          fi

          # main is protected: changes must arrive through a pull request and
          # pass the required eslint check. Push a branch and open a PR.
          BRANCH="chore/ios-beta-${VERSION_NAME}-${VERSION_CODE}"
          PR_TITLE="chore(ios): publish beta ${VERSION_NAME} (${VERSION_CODE})"
          LABEL="ios-release"

          git checkout -b "$BRANCH"
          git commit -m "$PR_TITLE"
          git push origin "HEAD:${BRANCH}"

          # Create the label if it is missing. It may already exist, and the
          # token may not be allowed to create it, so never fail on either.
          gh label create "$LABEL" \
            --repo "$GITHUB_REPOSITORY" \
            --color "0E8A16" \
            --description "Automated iOS TestFlight release metadata" || true

          # Build the body in a file: the notes are user input and may contain
          # quotes, backticks or backslashes.
          BODY_FILE="$RUNNER_TEMP/beta-pr-body.md"
          {
            echo "Automated beta metadata for iOS ${VERSION_NAME} (${VERSION_CODE})."
            echo
            echo "Published by the iOS release workflow (run ${GITHUB_RUN_ID}). The version"
            echo "was already uploaded to TestFlight, so this only refreshes"
            echo "\`docs/src/public/ios-beta.json\` on the download page."
          } > "$BODY_FILE"

          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$BRANCH" \
            --title "$PR_TITLE" \
            --label "$LABEL" \
            --body-file "$BODY_FILE" || {
            echo "::error::Failed to open the beta metadata pull request"
            exit 1
          }

          # Do not enable auto-merge. GitHub holds workflow runs triggered by a
          # GITHUB_TOKEN-created pull request for manual approval, so the
          # required eslint check never turns green on its own and auto-merge
          # would never fire. Leave the PR open for a human to merge, which
          # also gives the release notes a review before they go public.
          PR_URL=$(gh pr view "$BRANCH" --repo "$GITHUB_REPOSITORY" --json url --jq .url)
          echo "::notice::Opened beta metadata PR: ${PR_URL}"

      - name: Cleanup Keychain
        if: always()
        run: |
          security delete-keychain build.keychain 2>/dev/null || true
          # Restore original default keychain
          if [ -n "$ORIGINAL_DEFAULT_KEYCHAIN" ]; then
            security default-keychain -s "$ORIGINAL_DEFAULT_KEYCHAIN" 2>/dev/null || true
          else
            security default-keychain -s ~/Library/Keychains/login.keychain-db 2>/dev/null || true
          fi
          rm -f "$RUNNER_TEMP/private_keys/AuthKey.p8"

      - name: Cleanup proto git config
        if: always()
        run: |
          if [ -n "${GIT_CONFIG_GLOBAL:-}" ]; then
            rm -f "$GIT_CONFIG_GLOBAL"
          fi
