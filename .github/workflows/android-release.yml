name: Android Release Build

on:
  repository_dispatch:
    types: [android-release-requested]

concurrency:
  group: android-release-${{ github.event.client_payload.version_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      public_tag: ${{ steps.public-release.outputs.public_tag }}
      source_sha: ${{ steps.source.outputs.sha }}

    steps:
      - name: Checkout Android repository
        uses: actions/checkout@v5
        with:
          repository: whu-ham/ham-android
          ref: ${{ github.event.client_payload.source_ref }}
          token: ${{ secrets.HAM_ANDROID_REPO_TOKEN }}
          fetch-depth: 0

      # Pin the suite to the commit this release was built from. `source_ref`
      # names a branch, so resolving it again after the APK has been published
      # can land on a newer commit than the one that was built: a later fix
      # would then make a broken release look verified, and an unrelated
      # regression would fail one that was fine.
      #
      # Recorded before the version files are rewritten below, because those
      # edits are never committed — HEAD here is exactly what gets built.
      - name: Record the built commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Configure private proto repository access
        env:
          PROTO_REPO_TOKEN: ${{ secrets.PROTO_REPO_TOKEN }}
        run: |
          if [ -z "$PROTO_REPO_TOKEN" ]; then
            echo "::error::PROTO_REPO_TOKEN is required to clone whu-ham/ham-proto"
            exit 1
          fi
          PROTO_GIT_CONFIG="$RUNNER_TEMP/ham-proto-gitconfig"
          git config --file "$PROTO_GIT_CONFIG" url."https://x-access-token:${PROTO_REPO_TOKEN}@github.com/whu-ham/".insteadOf "https://github.com/whu-ham/"
          echo "GIT_CONFIG_GLOBAL=$PROTO_GIT_CONFIG" >> "$GITHUB_ENV"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.2.0
        with:
          version: 10.6.4
          run_install: false
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          gradle-home-cache-cleanup: true

      # `packages` is set explicitly to drop `tools` from the action's default of
      # "tools platform-tools". Google removed the `tools` package from the SDK, and a
      # current `sdkmanager` exits 1 on it ("Failed to find package 'tools'") rather than
      # warning, which fails this step and skips the rest of the release. `platform-tools`
      # is listed so the action still installs something; Gradle resolves build-tools,
      # platforms and NDK on demand through the Android Gradle Plugin.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      # The `ubuntu-latest` image already ships Rust (1.98.x) and an Android NDK at
      # `ANDROID_NDK_HOME` (27.3.13750724), so only the cross-compilation targets and
      # cargo-ndk are missing. The fastlane `build`/`beta`/`release` lanes run
      # `:app:cargoBuildRustRelease` before packaging, and that task shells out to
      # `cargo ndk`; without this step the lanes find no toolchain and fall back to the
      # committed libsec.so, which is a debug build.
      - name: Setup Rust for Android
        shell: bash
        run: |
          set -euo pipefail
          # Written to $GITHUB_PATH rather than only exported: `gradle/rust.gradle.kts`
          # runs cargo through `bash -lc`, and a later step would not see an export made
          # here.
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          # Pinned, so a cargo-ndk release cannot change the build.
          cargo install cargo-ndk --version 4.1.2 --locked

      - name: Update version files
        env:
          VERSION_CODE: ${{ github.event.client_payload.version_code }}
          VERSION_NAME: ${{ github.event.client_payload.version_name }}
        run: |
          echo -n "$VERSION_CODE" > android/metadata/versionCode
          echo -n "$VERSION_NAME" > android/metadata/versionName

      - name: Restore keystore
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/ham.jks"
          echo "$HAM_KEYSTORE_B64" | base64 -d > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
        env:
          HAM_KEYSTORE_B64: ${{ secrets.HAM_KEYSTORE_B64 }}

      - name: Setup GOOGLE_AUTH key
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/keys.json"
          echo "$GOOGLE_AUTH" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "SUPPLY_JSON_KEY=$KEY_PATH" >> "$GITHUB_ENV"
        env:
          GOOGLE_AUTH: ${{ secrets.GOOGLE_AUTH }}

      - name: Setup Ruby
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ruby >/dev/null 2>&1; then
            if command -v apt-get >/dev/null 2>&1; then
              if [ "$(id -u)" -eq 0 ]; then
                apt-get update
                DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential ruby-full
              elif command -v sudo >/dev/null 2>&1; then
                sudo apt-get update
                sudo DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential ruby-full
              else
                echo "::error::Ruby is missing and this runner cannot install packages"
                exit 1
              fi
            else
              echo "::error::Ruby is missing and apt-get is unavailable"
              exit 1
            fi
          fi
          if ! command -v make >/dev/null 2>&1; then
            if command -v apt-get >/dev/null 2>&1; then
              if [ "$(id -u)" -eq 0 ]; then
                apt-get update
                DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential
              elif command -v sudo >/dev/null 2>&1; then
                sudo apt-get update
                sudo DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential
              else
                echo "::error::make is missing and this runner cannot install build tools"
                exit 1
              fi
            else
              echo "::error::make is missing and apt-get is unavailable"
              exit 1
            fi
          fi
          ruby --version
          ruby -e 'abort("Ruby 3.1 or newer is required") if Gem::Version.new(RUBY_VERSION) < Gem::Version.new("3.1")'
          echo "GEM_HOME=$RUNNER_TEMP/gems" >> "$GITHUB_ENV"
          echo "GEM_PATH=$RUNNER_TEMP/gems" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/gems/bin" >> "$GITHUB_PATH"
          export GEM_HOME="$RUNNER_TEMP/gems"
          export GEM_PATH="$GEM_HOME"
          export PATH="$GEM_HOME/bin:$PATH"
          BUNDLER_VERSION=$(awk '/^BUNDLED WITH$/{getline; gsub(/^ +/, ""); print}' Gemfile.lock)
          gem install bundler --version "$BUNDLER_VERSION" --no-document
          bundle config set --local path "$RUNNER_TEMP/bundle"
          bundle install --jobs 4 --retry 3

      - name: Build Beta
        if: ${{ github.event.client_payload.build_type == 'beta' }}
        run: |
          cd android
          bundle exec fastlane android beta
        env:
          ORG_GRADLE_PROJECT_ham.key.password: ${{ secrets.HAM_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_ham.key.alias: ${{ secrets.HAM_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_versionType: beta

      - name: Build Release
        if: ${{ github.event.client_payload.build_type == 'release' }}
        run: |
          cd android
          bundle exec fastlane android release
        env:
          ORG_GRADLE_PROJECT_ham.key.password: ${{ secrets.HAM_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_ham.key.alias: ${{ secrets.HAM_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_versionType: release

      - name: Add fixed-name release APK
        if: ${{ github.event.client_payload.build_type == 'beta' || github.event.client_payload.build_type == 'release' }}
        env:
          BUILD_TYPE: ${{ github.event.client_payload.build_type }}
        run: |
          set -euo pipefail
          if [ "$BUILD_TYPE" = "beta" ]; then
            APK_NAME="Ham-beta.apk"
          else
            APK_NAME="Ham-release.apk"
          fi
          SOURCE_APK=$(find android/app/build/outputs/apk -type f -name '*Github*.apk' -print -quit)
          if [ -z "$SOURCE_APK" ]; then
            echo "No Github APK found"
            exit 1
          fi
          cp "$SOURCE_APK" "android/app/build/outputs/apk/$APK_NAME"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: android/app/build/outputs/apk/**/*.apk
          retention-days: 1

      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: release-apks
          path: apks
      - name: Resolve previous public release tag
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_TYPE: ${{ github.event.client_payload.build_type }}
        run: |
          set -euo pipefail
          # Public releases here use a different tag scheme (v1.7.6-beta2) from
          # the Android repository the notes are generated in (v1.7.6.191-beta).
          # The commit range has to come from the Android tags, since those are
          # real git refs, but the notes should show the public name users see.
          if [ "$BUILD_TYPE" = "release" ]; then
            PREVIOUS_PUBLIC_TAG=$(gh release list --repo "$GITHUB_REPOSITORY" \
              --limit 100 --json tagName,isPrerelease \
              --jq '[.[] | select(.isPrerelease | not)][0].tagName // empty' || true)
          else
            PREVIOUS_PUBLIC_TAG=$(gh release list --repo "$GITHUB_REPOSITORY" \
              --limit 100 --json tagName,isPrerelease \
              --jq '[.[] | select(.isPrerelease)][0].tagName // empty' || true)
          fi
          echo "PREVIOUS_PUBLIC_TAG=$PREVIOUS_PUBLIC_TAG" >> "$GITHUB_ENV"

      - name: Generate release notes
        id: release-notes
        env:
          BUILD_TYPE: ${{ github.event.client_payload.build_type }}
          VERSION_CODE: ${{ github.event.client_payload.version_code }}
          VERSION_NAME: ${{ github.event.client_payload.version_name }}
          SOURCE_REF: ${{ github.event.client_payload.source_ref }}
          # ham-android is private, so resolving a commit to its GitHub
          # account needs the Android token, not the workflow's own.
          GH_TOKEN: ${{ secrets.HAM_ANDROID_REPO_TOKEN }}
        run: |
          VERSION_NAME="$VERSION_NAME"
          VERSION_CODE="$VERSION_CODE"
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          echo "RELEASE_NOTES_FILE=$NOTES_FILE" >> "$GITHUB_ENV"

          # Cap the commit list so a long release window cannot produce an
          # unusable wall of text.
          MAX_COMMITS=50

          # Set by the previous step. Fall back to the Android tag when the
          # public release lookup came back empty.
          PREVIOUS_PUBLIC_TAG="${PREVIOUS_PUBLIC_TAG:-}"

          if [ "$BUILD_TYPE" = "beta" ]; then
            PREVIOUS_TAG=$(git tag --list 'v*-beta*' --sort=-version:refname | head -n 1 || true)
            TITLE="## 🚀 Beta - ${VERSION_NAME} (${VERSION_CODE})"
            BUILD_NOTE="> 此版本由 \`main\` 分支自动构建。"
            IMPORTANT_NOTE_1="- 这是自动生成的 Beta 构建，不建议在生产环境使用。"
            IMPORTANT_NOTE_2="- 已上传到 Google Play 内部测试。"
            IMPORTANT_NOTE_3="- Beta 版本可能包含不稳定或未完成的变更，请谨慎使用。"
          else
            PREVIOUS_TAG=$(git tag --list 'v*' --sort=-version:refname | grep -Ev -- '-beta' | head -n 1 || true)
            TITLE="## 🎉 Release - ${VERSION_NAME} (${VERSION_CODE})"
            BUILD_NOTE="> 此版本由 \`main\` 分支自动构建。"
            IMPORTANT_NOTE_1="- 已上传到 Google Play 内部测试。"
            IMPORTANT_NOTE_2=""
            IMPORTANT_NOTE_3=""
          fi

          # Tab-separated, and keyed by the full SHA: the rows are joined
          # against the API below, which is the only place the GitHub account
          # behind each commit is recorded.
          COMMITS=""
          if [ -n "$PREVIOUS_TAG" ]; then
            COMMITS=$(git log "${PREVIOUS_TAG}..${SOURCE_REF}" --no-merges --pretty=format:'%H%x09%an%x09%s' | grep -Fv 'chore: bump version to ' || true)
          fi
          COMMIT_COUNT=$(printf '%s\n' "$COMMITS" | sed '/^$/d' | wc -l | tr -d ' ')
          SHOWN_COMMITS="$COMMITS"
          if [ "$COMMIT_COUNT" -gt "$MAX_COMMITS" ]; then
            SHOWN_COMMITS=$(printf '%s\n' "$COMMITS" | sed '/^$/d' | head -n "$MAX_COMMITS")
          fi

          # These notes are published in this repository while the commits
          # come from whu-ham/ham-android, so a bare `#119` in a subject is
          # read as issue 119 of whu-ham.github.io. It is qualified below so
          # the link lands on the Android pull request it was merged from.
          #
          # The author needs the same care, and more than an `@` prefix: git
          # records a name, not a GitHub account. `orangeboy` here is
          # `orangeboyChen` on GitHub, and `@orangeboy` is a different account
          # that exists, so prefixing the name would name the wrong person.
          # Each commit is therefore resolved to the account that authored it.
          # Authors with no linked account keep the plain git name, and bot
          # authors stay plain too: GitHub links `@dependabot[bot]` to the
          # `dependabot` organisation and leaves `@github-actions[bot]` as
          # text, so an `@` there would only mislead.
          LOGIN_BY_SHA="$RUNNER_TEMP/commit-logins.json"
          LOGIN_PAGES="$RUNNER_TEMP/commit-login-pages.json"
          printf '{}\n' > "$LOGIN_BY_SHA"
          : > "$LOGIN_PAGES"
          if [ -n "$PREVIOUS_TAG" ] && [ -n "$SHOWN_COMMITS" ]; then
            # The commits array is returned oldest first and capped at 250
            # entries per page, while SHOWN_COMMITS holds the newest 50: a
            # single response covers the oldest commits of the range, so a
            # window longer than one page would match none of the commits
            # shown and every author would silently fall back to the git
            # name. --paginate walks the remaining pages.
            #
            # --jq runs once per page, so every page emits its own object
            # rather than one merged map; they are combined below. A failure
            # here must not fail the release, so an empty map falls back to
            # the git name.
            gh api --paginate "repos/whu-ham/ham-android/compare/${PREVIOUS_TAG}...${SOURCE_REF}" \
              --jq '[.commits[] | .author.login as $login | {key: .sha, value: (if $login == null then .commit.author.name elif ($login | endswith("[bot]")) then $login else "@" + $login end)}] | from_entries' \
              > "$LOGIN_PAGES" || : > "$LOGIN_PAGES"
            # `add` over an empty stream yields null, hence the `// {}`.
            jq -s 'add // {}' "$LOGIN_PAGES" > "$LOGIN_BY_SHA"
          fi

          SHOWN_LINES=$(printf '%s\n' "$SHOWN_COMMITS" | jq -Rr --slurpfile logins "$LOGIN_BY_SHA" '
            ($logins[0] // {}) as $logins
            | select(length > 0)
            | split("\t") as $commit
            | ($commit[0]) as $sha
            | ($logins[$sha] // $commit[1]) as $author
            | ($commit[2] | gsub("(?<p>^|[^A-Za-z0-9_./-])#(?<n>[0-9]+)"; "\(.p)whu-ham/ham-android#\(.n)")) as $subject
            | "- `\($sha[0:8])` \($subject) (\($author))"')

          {
            echo "$TITLE"
            echo
            echo "$BUILD_NOTE"
            echo
            echo "### 📝 更新日志"
            echo
            echo "待更新"
            echo
            echo "### 🔍 提交信息"
            echo
            if [ -n "$PREVIOUS_TAG" ]; then
              # A blockquote, so GitHub can never join this line to the
              # commit list that follows it.
              if [ -n "$PREVIOUS_PUBLIC_TAG" ]; then
                echo "> 基于 \`${PREVIOUS_PUBLIC_TAG}\` 之后的变更，提交数量：${COMMIT_COUNT}"
              else
                echo "> 基于 \`${PREVIOUS_TAG}\` 之后的变更，提交数量：${COMMIT_COUNT}"
              fi
              echo
              if [ -n "$SHOWN_LINES" ]; then
                echo "$SHOWN_LINES"
                if [ "$COMMIT_COUNT" -gt "$MAX_COMMITS" ]; then
                  echo
                  echo "- 仅显示最近 ${MAX_COMMITS} 条提交，完整列表见提交历史。"
                fi
              else
                echo "- 该范围内没有匹配的提交。"
              fi
            else
              echo "未找到符合条件的上一版本标签。"
            fi
            echo
            echo "### ⚠️ 注意事项"
            echo
            for NOTE in "$IMPORTANT_NOTE_1" "$IMPORTANT_NOTE_2" "$IMPORTANT_NOTE_3"; do
              if [ -n "$NOTE" ]; then
                echo "$NOTE"
              fi
            done
            echo
          } > "$NOTES_FILE"

      - name: Determine public release tag
        id: public-release
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_TYPE: ${{ github.event.client_payload.build_type }}
          VERSION_NAME: ${{ github.event.client_payload.version_name }}
        run: |
          set -euo pipefail
          if [ "$BUILD_TYPE" = "release" ]; then
            PUBLIC_TAG="v${VERSION_NAME}"
            BETA_NUM=""
          else
            EXISTING_TAGS=$(gh api "repos/${GITHUB_REPOSITORY}/git/refs/tags" --paginate --jq '.[].ref')
            MAX_BETA=0
            for REF in $EXISTING_TAGS; do
              case "$REF" in
                refs/tags/v${VERSION_NAME}-beta*)
                  NUM="${REF##*-beta}"
                  if [ "$NUM" -gt "$MAX_BETA" ] 2>/dev/null; then
                    MAX_BETA="$NUM"
                  fi
                  ;;
              esac
            done
            BETA_NUM=$((MAX_BETA + 1))
            PUBLIC_TAG="v${VERSION_NAME}-beta${BETA_NUM}"
          fi
          echo "public_tag=$PUBLIC_TAG" >> "$GITHUB_OUTPUT"
          echo "beta_num=$BETA_NUM" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_TYPE: ${{ github.event.client_payload.build_type }}
          PUBLIC_TAG: ${{ steps.public-release.outputs.public_tag }}
        run: |
          RELEASE_ARGS=("$PUBLIC_TAG" --repo "$GITHUB_REPOSITORY" --title "$PUBLIC_TAG" --notes-file "$RELEASE_NOTES_FILE")
          if [ "$BUILD_TYPE" = "beta" ]; then
            RELEASE_ARGS+=(--prerelease)
          else
            RELEASE_ARGS+=(--draft)
          fi
          GITHUB_APKS=$(find apks -type f -name '*Github*.apk')
          FIXED_APK=$(find apks -type f \( -name 'Ham-release.apk' -o -name 'Ham-beta.apk' \))
          if [ -z "$GITHUB_APKS" ] || [ -z "$FIXED_APK" ]; then
            echo "No Github APKs found"
            exit 1
          fi
          gh release create "${RELEASE_ARGS[@]}" $GITHUB_APKS $FIXED_APK

      - name: Notify Android repository
        env:
          GH_TOKEN: ${{ secrets.HAM_ANDROID_DISPATCH_TOKEN }}
          REQUEST_ID: ${{ github.event.client_payload.request_id }}
          BUILD_TYPE: ${{ github.event.client_payload.build_type }}
          VERSION_CODE: ${{ github.event.client_payload.version_code }}
          VERSION_NAME: ${{ github.event.client_payload.version_name }}
          SOURCE_REF: ${{ github.event.client_payload.source_ref }}
          PUBLIC_TAG: ${{ steps.public-release.outputs.public_tag }}
          BETA_NUM: ${{ steps.public-release.outputs.beta_num }}
        run: |
          gh api repos/whu-ham/ham-android/dispatches --method POST --input - <<JSON
          {
            "event_type": "android-release-completed",
            "client_payload": {
              "request_id": "${REQUEST_ID}",
              "build_type": "${BUILD_TYPE}",
              "version_code": "${VERSION_CODE}",
              "version_name": "${VERSION_NAME}",
              "source_ref": "${SOURCE_REF}",
              "public_tag": "${PUBLIC_TAG}",
              "beta_num": "${BETA_NUM}"
            }
          }
          JSON

      # Runs after the callback so a pruning failure cannot stop ham-android
      # from recording the release it just published.
      - name: Prune superseded beta releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MAX_BETA_RELEASES=5

          # Every beta release carries its own APKs, so the release list is
          # where the repository storage goes. Only the newest
          # MAX_BETA_RELEASES betas stay: older ones are superseded, and the
          # download page never links past a handful of them anyway.
          #
          # A release only counts as a beta when GitHub flags it as a
          # prerelease *and* its tag is `v`, a dotted numeric version, then
          # `-betaN`, as in `v1.7.6-beta9`. The version grammar is numeric on
          # purpose: a looser match would treat an unrelated prerelease such
          # as `vnightly-beta1` as an Android beta and delete it, and the tag
          # shape also keeps the releases this workflow never created
          # out of the pruning.
          #
          # The pages are collected first and filtered in a single jq pass,
          # because `gh api --paginate` applies `--jq` to each page on its own:
          # slicing there would keep five betas *per page* and delete the rest
          # of every page. `gh release list` is no alternative, since its
          # `--limit` spans pages but is still a ceiling, so betas beyond it
          # stay invisible to the filter and silently survive the pruning.
          #
          # Sorting by created_at rather than trusting the API order keeps the
          # oldest betas on the chopping block whichever way GitHub returns
          # them. The git tags are deliberately left in place: the next beta
          # number is derived from them, and reusing a number whose release
          # was deleted would point existing download links at a different
          # build.
          RELEASE_LIST="$RUNNER_TEMP/releases.json"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > "$RELEASE_LIST"
          PRUNE_TAGS=$(jq -r --argjson keep "$MAX_BETA_RELEASES" '
            [.[] | select(.prerelease and (.tag_name | test("^v[0-9]+([.][0-9]+)*-beta[0-9]+$")))]
            | sort_by(.created_at) | reverse
            | .[$keep:][].tag_name' "$RELEASE_LIST")
          if [ -z "$PRUNE_TAGS" ]; then
            echo "At most $MAX_BETA_RELEASES beta releases present, nothing to prune."
            exit 0
          fi
          printf '%s\n' "$PRUNE_TAGS" | while read -r TAG; do
            echo "Deleting superseded beta release $TAG"
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
          done

      # Publishes what the E2E suite needs to know about this release.
      #
      # Nothing in this workflow waits for the suite any more: android-e2e-auto.yml
      # starts its own run off `workflow_run` once this one completes, so this run
      # ends with the build instead of sitting open for hours, and the next
      # release is not queued behind the suite. An artifact is the only thing that
      # crosses between the two runs — a `workflow_run` event carries no inputs.
      #
      # The commit is the SHA recorded at checkout, not `source_ref`: the suite
      # must test the code this release was built from, not a branch that has
      # moved on since. See that step for why re-resolving it here would be
      # wrong.
      #
      # Last step of the job on purpose: the artifact is what starts the suite, so
      # a build that failed anywhere above publishes nothing and is followed by
      # no run at all.
      - name: Write the E2E context
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          VERSION_NAME: ${{ github.event.client_payload.version_name }}
          VERSION_CODE: ${{ github.event.client_payload.version_code }}
        run: |
          set -euo pipefail
          jq -n \
            --arg sha "$SOURCE_SHA" \
            --arg name "$VERSION_NAME" \
            --arg code "$VERSION_CODE" \
            '{source_sha: $sha, version_name: $name, version_code: $code}' \
            > "$RUNNER_TEMP/e2e-context.json"
          cat "$RUNNER_TEMP/e2e-context.json"

      - name: Upload the E2E context
        uses: actions/upload-artifact@v4
        with:
          name: android-e2e-context
          path: ${{ runner.temp }}/e2e-context.json
          # A week is generous: the suite starts seconds after this run ends. It
          # only ever has to outlive a queue behind another suite.
          retention-days: 7

      - name: Cleanup credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/keys.json" "$RUNNER_TEMP/ham.jks"
          if [ -n "${GIT_CONFIG_GLOBAL:-}" ]; then
            rm -f "$GIT_CONFIG_GLOBAL"
          fi

  # The suite is no longer a job of this run, but it still follows every release:
