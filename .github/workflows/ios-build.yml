name: iOS Manual Build

on:
  workflow_dispatch:
    inputs:
      branch:
        description: iOS branch to build
        required: true
        type: string
        default: main

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Checkout iOS repository
        uses: actions/checkout@v5
        with:
          repository: whu-ham/ham-ios
          ref: ${{ inputs.branch }}
          token: ${{ secrets.HAM_IOS_REPO_TOKEN }}
          fetch-depth: 0

      - name: Configure private proto repository access
        env:
          PROTO_REPO_TOKEN: ${{ secrets.PROTO_REPO_TOKEN }}
        run: |
          if [ -z "$PROTO_REPO_TOKEN" ]; then
            echo "::error::PROTO_REPO_TOKEN is required to clone whu-ham/ham-proto"
            exit 1
          fi
          PROTO_GIT_CONFIG="$RUNNER_TEMP/ham-proto-gitconfig"
          git config --file "$PROTO_GIT_CONFIG" url."https://x-access-token:${PROTO_REPO_TOKEN}@github.com/whu-ham/ham-proto.git".insteadOf "https://github.com/whu-ham/ham-proto.git"
          echo "GIT_CONFIG_GLOBAL=$PROTO_GIT_CONFIG" >> "$GITHUB_ENV"

      - name: Install fastlane
        run: |
          # fastlane is the only thing the Ruby toolchain was installed for:
          # the Gemfile lists just `gem "fastlane"`, there is no
          # fastlane/Pluginfile, and the lane uses only built-in actions.
          # Installing it with brew instead of Bundler also avoids a PATH
          # conflict: `brew install ruby` upgrades the runner's Ruby 3.4 to
          # 4.0, but /opt/homebrew/lib/ruby/gems/3.4.0/bin/bundle shadows the
          # new one, so `bundle install` and `bundle exec fastlane` end up
          # looking in different gem directories and the latter fails with
          # "Could not find fastlane-... in locally installed gems".
          brew install fastlane
          fastlane --version

      - name: Install protobuf
        run: |
          # The Podfile's post_install hook shells out to `protoc` to generate
          # the HamProtobuf Swift sources. That binary is not preinstalled on
          # GitHub-hosted macOS runners, so the step fails with
          # "Failed to generate HamProtobuf Swift sources".
          brew install protobuf
          protoc --version

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.2.0
        with:
          version: 10.6.4
          # pod_install.sh runs `pnpm install` before applying the glog patch.
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup App Store Connect API Key
        env:
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          echo "$ASC_KEY_CONTENT" > "$RUNNER_TEMP/private_keys/AuthKey.p8"

      - name: Create Keychain
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # Save original default keychain for later restoration
          ORIGINAL_DEFAULT=$(security default-keychain -d user | xargs)
          echo "ORIGINAL_DEFAULT_KEYCHAIN=$ORIGINAL_DEFAULT" >> $GITHUB_ENV
          security delete-keychain build.keychain 2>/dev/null || true
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | sed s/\"//g)

      - name: Cache CocoaPods downloads
        uses: actions/cache@v4
        with:
          # Only the download cache. ~/.cocoapods/repos is intentionally
          # excluded: it held the multi-gigabyte git spec repo this workflow
          # used before switching to CDN, and restoring it would cost more
          # than it saves.
          path: ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-cocoapods-${{ hashFiles('Ham/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-cocoapods-

      - name: Cache SwiftPM artifacts
        uses: actions/cache@v4
        with:
          # Binary artifacts (the protoc bundle, OpenSSL.xcframework) and the
          # cloned package repositories. Both the SwiftPM CLI and xcodebuild
          # read them from here, so a hit means neither has to download.
          path: |
            ~/Library/Caches/org.swift.swiftpm/artifacts
            ~/Library/Caches/org.swift.swiftpm/repositories
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('Ham/Ham.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'Component/HamProtobuf/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-

      - name: Install CocoaPods
        run: |
          # Pin the version recorded in Ham/Podfile.lock, which must stay at
          # 1.17.0. A newer CocoaPods rewrites every checksum in that file.
          COCOAPODS_VERSION=$(awk -F': *' '/^COCOAPODS:/{print $2; exit}' Ham/Podfile.lock)
          if [ -z "$COCOAPODS_VERSION" ]; then
            echo "::error::Could not read the COCOAPODS version from Ham/Podfile.lock"
            exit 1
          fi
          if gem list -i cocoapods --version "$COCOAPODS_VERSION" >/dev/null; then
            echo "CocoaPods $COCOAPODS_VERSION already installed"
          else
            echo "Installing CocoaPods $COCOAPODS_VERSION"
            gem install cocoapods --version "$COCOAPODS_VERSION" --no-document
          fi

      - name: CocoaPods Install
        run: |
          # Use the project's own script rather than calling `pod install`
          # directly. It also applies the glog configure patch that
          # `pnpm install` alone does not, and it runs without `--repo-update`
          # because Podfile.lock pins every version.
          ./pod_install.sh

      - name: Build IPA
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PATH: ${{ runner.temp }}/private_keys/AuthKey.p8
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: fastlane ios build

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-manual-build
          path: fastlane/build/ham.ipa
          retention-days: 7
          if-no-files-found: error

      - name: Cleanup Keychain
        if: always()
        run: |
          security delete-keychain build.keychain 2>/dev/null || true
          # Restore original default keychain
          if [ -n "$ORIGINAL_DEFAULT_KEYCHAIN" ]; then
            security default-keychain -s "$ORIGINAL_DEFAULT_KEYCHAIN" 2>/dev/null || true
          else
            security default-keychain -s ~/Library/Keychains/login.keychain-db 2>/dev/null || true
          fi
          rm -f "$RUNNER_TEMP/private_keys/AuthKey.p8"

      - name: Cleanup proto git config
        if: always()
        run: |
          if [ -n "${GIT_CONFIG_GLOBAL:-}" ]; then
            rm -f "$GIT_CONFIG_GLOBAL"
          fi
