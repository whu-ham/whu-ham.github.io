name: Android Manual E2E

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Android branch to test
        required: true
        type: string
        default: main
      scope:
        description: Which instrumentation test targets to run
        required: true
        type: choice
        options:
          - app
          - all
        default: app
      api_level:
        description: Emulator Android API level
        required: true
        type: choice
        options:
          - '35'
          - '36'
        default: '35'
      shards:
        description: 'How many separate processes to split the :app suite across (raise it if the run still dies of OOM)'
        required: true
        type: string
        default: '12'

concurrency:
  group: android-e2e-${{ inputs.branch }}
  cancel-in-progress: true

jobs:
  e2e:
    # Google publishes the Android emulator for Linux as x86_64 only, and the
    # Linux runners expose KVM, so the x86_64 system image boots accelerated.
    # The emulator also ships a darwin_aarch64 build, but hosted macOS runners
    # deny nested virtualization: the ARM emulator dies immediately with
    # "HVF error: HV_UNSUPPORTED" and the AVD never comes online.
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read

    steps:
      - name: Enable KVM group perms
        run: |
          # The emulator action probes /dev/kvm and silently falls back to
          # `-accel off` when the runner user cannot open it. Software-emulated
          # x86_64 then never finishes booting inside the timeout. Granting
          # group access here is the setup the action's README requires for
          # hardware acceleration on Linux runners.
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Free runner disk space
        run: |
          # Hosted runners ship a large preinstalled toolchain that an Android
          # build never touches. Removing it leaves room for the SDK, the
          # emulator image, and the Gradle build output.
          #
          # Keep swap enabled. Disabling it here used to be cargo-culted in
          # from the usual disk-space snippets, but this job is memory-bound
          # rather than disk-bound: the emulator reserves 3G and Gradle peaks
          # well above its heap while running CMake, KSP and Dex. With swap
          # off, memory pressure is resolved by the kernel OOM killer, which
          # tears down the whole runner mid-build. With swap on, the same
          # pressure degrades to paging instead.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY/CodeQL" 2>/dev/null || true
          df -h /

      - name: Checkout Android repository
        uses: actions/checkout@v5
        with:
          repository: whu-ham/ham-android
          ref: ${{ inputs.branch }}
          token: ${{ secrets.HAM_ANDROID_REPO_TOKEN }}
          fetch-depth: 1

      - name: Configure private proto repository access
        env:
          PROTO_REPO_TOKEN: ${{ secrets.PROTO_REPO_TOKEN }}
        run: |
          if [ -z "$PROTO_REPO_TOKEN" ]; then
            echo "::error::PROTO_REPO_TOKEN is required to clone whu-ham/ham-proto"
            exit 1
          fi
          PROTO_GIT_CONFIG="$RUNNER_TEMP/ham-proto-gitconfig"
          git config --file "$PROTO_GIT_CONFIG" url."https://x-access-token:${PROTO_REPO_TOKEN}@github.com/whu-ham/".insteadOf "https://github.com/whu-ham/"
          echo "GIT_CONFIG_GLOBAL=$PROTO_GIT_CONFIG" >> "$GITHUB_ENV"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.2.0
        with:
          version: 10.6.4
          run_install: false
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The checked-in gradle.properties asks for a 10 GB heap and 16 parallel
      # workers, which does not fit on a hosted runner that also has to run the
      # emulator. A Gradle user-home gradle.properties takes precedence over the
      # project one, so this tunes the build without touching the checkout.
      #
      # The Linux runner has 16 GB total. The AVD below reserves 3 GB, and the
      # build's real peaks come from parallel CMake/Clang, KSP and Dex workers
      # rather than from the Gradle heap alone, so cap the heap at 3 GB and cap
      # worker count to keep the combined ceiling well under the machine.
      - name: Tune Gradle for hosted runners
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.gradle"
          cat >> "$HOME/.gradle/gradle.properties" <<'GRADLE'
          org.gradle.daemon=false
          org.gradle.parallel=false
          org.gradle.workers.max=2
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          GRADLE

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            platform-tools \
            platforms\;android-36 \
            build-tools\;36.0.0 \
            ndk\;27.0.12077973 \
            cmake\;3.22.1
          echo "ANDROID_USER_HOME=$RUNNER_TEMP/android-user-home" >> "$GITHUB_ENV"

      - name: Run instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.api_level }}
          target: google_apis
          # GithubDebug keeps both arm64-v8a and x86_64: the Github flavor pins
          # arm64-v8a and the debug build type adds x86_64, and AGP merges
          # abiFilters as a union. The x86_64 slice is what this emulator runs.
          arch: x86_64
          profile: pixel_6
          # The Linux runner has 4 cores; leave two for the host and Gradle.
          cores: 2
          # 3 GB rather than 4: the emulator and the Gradle build have to fit
          # in 16 GB together, and the build's own peak is what pushes it over.
          ram-size: 3072M
          heap-size: 512M
          disable-animations: true
          # A boot failure leaves adb polling against a dead emulator, so cap
          # the wait well below the job timeout and let the step fail fast.
          emulator-boot-timeout: 600
          working-directory: android
          # Keep this a single logical line. script-parser.ts splits the value
          # on newlines and runs each line as its own `sh -c`, so variables do
          # not survive across lines, multi-line `if`/`fi` blocks fail to
          # parse, and `#` comment lines are dropped. `sh` is dash on Ubuntu,
          # so `set -o pipefail` is illegal here too.
          #
          # The :app suite runs as $SHARDS separate Gradle invocations. It has
          # to: instrumentation reuses one process for the whole run, and the
          # app retains roughly 1.4 MB of Java heap (plus ~9 MB of native
          # memory) per case, so a single invocation of all ~394 cases exhausts
          # the 192 MB cap partway through and the run is reported as
          # "Process crashed" with the remaining cases never executed. A shard
          # is its own invocation and therefore its own process, so the
          # retained set starts over each time.
          #
          # Failures are collected rather than failing fast, so one bad shard
          # does not hide the results of the other eleven, and each shard's
          # XML is copied aside before the next invocation wipes the results
          # directory.
          #
          # The results directory is cleared before every shard. Two reasons,
          # both load-bearing: AGP does not clear it itself, so without this
          # shard N's copy also contains every earlier shard's XML and each
          # shard appears to have run the tests of all the shards before it;
          # and a stale result file makes Gradle fail the *next* invocation
          # with "Could not load test results".
          script: >-
            chmod +x ./gradlew &&
            SHARDS="$E2E_SHARDS" &&
            SCOPE="$E2E_SCOPE" &&
            case "$SHARDS" in
            ''|*[!0-9]*) echo "::error::shards must be a positive integer, got '$SHARDS'"; exit 1;;
            esac &&
            if [ "$SHARDS" -lt 1 ]; then echo "::error::shards must be at least 1, got '$SHARDS'"; exit 1; fi &&
            FAILED=0 &&
            I=0 &&
            while [ "$I" -lt "$SHARDS" ]; do
            echo "=== :app shard $((I+1)) of $SHARDS ===";
            rm -rf app/build/outputs/androidTest-results;
            mkdir -p app/build/outputs/androidTest-results;
            ./gradlew --no-daemon -Pandroid.builder.sdkDownload=false
            -Pandroid.testInstrumentationRunnerArguments.numShards=$SHARDS
            -Pandroid.testInstrumentationRunnerArguments.shardIndex=$I
            :app:connectedGithubDebugAndroidTest || FAILED=1;
            mkdir -p app/build/outputs/e2e-shards/$I;
            cp -a app/build/outputs/androidTest-results/. app/build/outputs/e2e-shards/$I/;
            I=$((I+1));
            done;
            if [ "$SCOPE" = "all" ]; then
            ./gradlew --no-daemon -Pandroid.builder.sdkDownload=false
            :feature:schedule:connectedDebugAndroidTest
            :feature:my:connectedDebugAndroidTest
            :feature:sport:connectedDebugAndroidTest
            :feature:score:connectedDebugAndroidTest
            :feature:print:connectedDebugAndroidTest
            :feature:coursescore:connectedDebugAndroidTest || FAILED=1;
            fi;
            echo "SHARD_FAILURES=$FAILED";
            [ "$FAILED" -eq 0 ]
        # The dispatch inputs reach the script through the environment rather than
        # as inline ${{ }} substitutions. Interpolating them cannot be made safe by
        # quoting: GitHub expands the expression into the shell source *before* the
        # shell parses it, so a `shards` value containing a double quote terminates
        # the string and injects whatever follows as a command — while still
        # passing the numeric check inside the script. This step runs with
        # GIT_CONFIG_GLOBAL pointing at a file holding PROTO_REPO_TOKEN, so
        # injected commands could read that token. Reading from the environment
        # keeps the value data rather than code.
        env:
          E2E_SHARDS: ${{ inputs.shards }}
          E2E_SCOPE: ${{ inputs.scope }}

      # A shard that OOMs is reported by Gradle as "Process crashed", which fails
      # this job already. What that report does *not* say is how many cases never
      # ran, so an aborted run looks like a run with one failure. Summing the
      # per-shard XMLs is what turns "shard 7 crashed" into "N of M cases ran".
      - name: Summarise E2E shard results
        if: always()
        working-directory: android
        run: |
          set -uo pipefail
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET, sys

          # Per-shard XMLs are the source of truth. The live results directory is
          # only consulted when no shard was collected at all, because after the
          # loop it still holds the *last* shard's XML — counting it as well
          # double-counts that shard and inflates the total.
          files = sorted(glob.glob("app/build/outputs/e2e-shards/*/**/*.xml", recursive=True))
          if not files:
              files = sorted(glob.glob("app/build/outputs/androidTest-results/**/*.xml", recursive=True))
              print("::warning::No per-shard results found; falling back to the live results directory")

          total = failures = errors = 0
          shards = {}
          for path in files:
              try:
                  root = ET.parse(path).getroot()
              except ET.ParseError:
                  continue
              if root.tag not in ("testsuite", "testsuites"):
                  continue
              for suite in ([root] if root.tag == "testsuite" else root.iter("testsuite")):
                  total += int(suite.get("tests", 0) or 0)
                  failures += int(suite.get("failures", 0) or 0)
                  errors += int(suite.get("errors", 0) or 0)
              shard = path.split("e2e-shards/")[1].split("/")[0] if "e2e-shards/" in path else "final"
              shards[shard] = shards.get(shard, 0) + int(root.get("tests", 0) or 0)

          print(f"E2E cases executed: {total}, failures: {failures}, errors: {errors}")
          for shard in sorted(shards, key=lambda s: (s == "final", s)):
              print(f"  shard {shard}: {shards[shard]} cases")
          if total == 0:
              print("::error::No E2E results were collected at all")
              sys.exit(1)
          short = [s for s, n in shards.items() if s != "final" and n == 0]
          if short:
              print(f"::error::These shards reported zero cases: {', '.join(sorted(short))}")
              sys.exit(1)
          print(f"::warning::Expected ~394 :app cases; if this total is far below it, a shard aborted early")
          PY

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-e2e-reports
          path: |
            android/**/build/reports/androidTests/**
            android/**/build/outputs/androidTest-results/**
            android/**/build/outputs/e2e-shards/**
          retention-days: 7
          if-no-files-found: warn

      - name: Cleanup private proto repository access
        if: always()
        run: |
          if [ -n "${GIT_CONFIG_GLOBAL:-}" ]; then
            rm -f "$GIT_CONFIG_GLOBAL"
          fi
